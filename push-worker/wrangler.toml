# Cloudflare Worker that sends the app's phone notifications (FCM).
# Deployed by .github/workflows/push-worker.yml; see CLAUDE.md.
name = "uob-push"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PROJECT_ID = "basrah-researches"
# Public reads for the pages on Hosting: 15% of Spark's 50,000 a day.
PUBLIC_DAILY_READS = "7500"

# The daily counter of public reads (src/quota.js), shared by all locations.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "PublicQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PublicQuota"]
