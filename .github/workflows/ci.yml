# Runs on every push and pull request: nothing reaches users untested.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  flutter:
    name: Flutter (analyze, test, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: System SQLite for Drift tests (pubspec hooks use it on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Placeholder firebase_options.dart (real keys are never in the repo)
        run: ./tool/ensure_firebase_options.sh
      - run: flutter pub get
      - name: Generated code is committed and up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib/l10n lib/core/database/app_database.g.dart
      - run: flutter analyze
      - run: flutter test --timeout 120s
      - run: flutter build web --release

  rules:
    uses: ./.github/workflows/rules-tests.yml
