# Builds the iPhone app on GitHub's macOS servers (no Mac needed) and uploads
# it to App Store Connect, where it appears in TestFlight and can be sent to
# review. Manual only (Actions → iOS → Run workflow): macOS minutes count ten
# times against the free allowance of a private repository.
#
# Signing is fetched with the App Store Connect API key (codemagic-cli-tools):
# the App Store distribution certificate is created once from
# IOS_CERTIFICATE_PRIVATE_KEY and reused, with a provisioning profile for the
# bundle ID (registered in the Apple account with Push Notifications on).
#
# Secrets (Settings → Secrets and variables → Actions), see CLAUDE.md:
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID (App Store Connect → Users and Access → Integrations)
#   APP_STORE_CONNECT_KEY_ID      Key ID of the team API key (Admin role)
#   APP_STORE_CONNECT_API_KEY     the AuthKey_XXXX.p8 file's text
#   IOS_CERTIFICATE_PRIVATE_KEY   RSA key in PEM, made once: ssh-keygen -t rsa -b 2048 -m PEM -f ios_cert_key -q -N ""
#   FIREBASE_OPTIONS_DART_B64     must include the iOS app's options
#   SHOREBIRD_TOKEN               optional: build a Shorebird release (patchable)
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (TestFlight)'
        type: boolean
        default: true
      shorebird:
        description: 'Build as a Shorebird release (needs SHOREBIRD_TOKEN)'
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6
  BUNDLE_ID: iq.edu.uobasrah.uobAttendance

jobs:
  ipa:
    name: Build IPA
    # App Store uploads must be built with the current iOS SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
      SHOREBIRD_TOKEN: ${{ inputs.shorebird && secrets.SHOREBIRD_TOKEN || '' }}
    steps:
      # Names only, never values.
      - name: Required secrets
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          missing=""
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY FIREBASE_OPTIONS_DART_B64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (APP_STORE_CONNECT_KEY_IDENTIFIER = APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_PRIVATE_KEY = APP_STORE_CONNECT_API_KEY, CERTIFICATE_PRIVATE_KEY = IOS_CERTIFICATE_PRIVATE_KEY)"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Firebase configuration from secrets
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
          if ! grep -q "FirebaseOptions ios" lib/firebase_options.dart; then
            echo "::error::lib/firebase_options.dart has no iOS options: add the iOS app in Firebase (flutterfire configure) and update FIREBASE_OPTIONS_DART_B64"
            exit 1
          fi

      - run: flutter pub get

      - name: Signing (certificate and App Store profile)
        run: |
          pip3 install --quiet --break-system-packages codemagic-cli-tools
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - uses: shorebirdtech/setup-shorebird@v1
        if: env.SHOREBIRD_TOKEN != ''
        with:
          cache: true

      # CFBundleVersion must grow with every upload of the same version.
      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PUSH_URL: ${{ vars.PUSH_URL }}
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            shorebird release ios --flutter-version="$FLUTTER_VERSION" --export-options-plist="$HOME/export_options.plist" -- --build-number="$BUILD_NUMBER" --dart-define=PUSH_URL="$PUSH_URL"
          else
            flutter build ipa --release --export-options-plist="$HOME/export_options.plist" --build-number="$BUILD_NUMBER" --dart-define=PUSH_URL="$PUSH_URL"
          fi
          ls -l build/ios/ipa

      - name: Upload to App Store Connect
        if: inputs.upload
        run: app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"

      - uses: actions/upload-artifact@v6
        with:
          name: ios-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 14
          overwrite: true

      - name: Remove the signing keychain
        if: always()
        run: keychain use-login || true
