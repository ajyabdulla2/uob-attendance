# Firestore security rules tests on the Firebase Emulator.
# Reused by ci.yml (every push) and deploy.yml (gate before deploying rules).
name: Rules tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - name: Install test dependencies and Firebase CLI
        run: |
          npm ci --prefix rules-tests
          npm install -g firebase-tools@15
      - name: Run rules tests
        run: firebase emulators:exec --only firestore --project demo-uob-attendance "npm --prefix rules-tests test"
