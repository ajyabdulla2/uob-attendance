# Ships a Dart-only change to phones that run a Shorebird release, without
# a new APK: push a tag  patch/<release>  where <release> is the APK's
# version+build, e.g.  git tag patch/1.3.0+12 && git push origin patch/1.3.0+12
# Phones download the patch in the background and apply it on next launch.
# Native changes (packages with Android code, android/, icons) still need a
# new APK. Secrets as in android.yml, plus SHOREBIRD_TOKEN.
name: Shorebird patch

on:
  push:
    tags: ['patch/*']

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: 'true'
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Firebase configuration from secrets
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_B64" ]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::FIREBASE_OPTIONS_DART_B64 is required for a release"
            exit 1
          else
            echo "::warning::No FIREBASE_OPTIONS_DART_B64 secret: this APK only shows the configuration screen."
            ./tool/ensure_firebase_options.sh
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          fi

      - name: Upload keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
          elif [ "$IS_RELEASE" = "true" ]; then
            # A debug-signed APK cannot update a release-signed install.
            echo "::error::ANDROID_KEYSTORE_B64 is required for a release"
            exit 1
          else
            echo "::warning::No keystore secret: APK is signed with a throw-away debug key (testing only)."
          fi

      - run: flutter pub get

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Patch the release
        run: |
          # patch/1.3.0+12 — or patch/1.3.0+12-2 for a second patch (tags
          # cannot be reused; a «/2» suffix clashes with the first tag's ref).
          release="${GITHUB_REF_NAME#patch/}"
          release="${release%%-*}"
          echo "Patching release $release"
          # A patch cannot ship assets. Only the generated license list
          # (NOTICES.Z, new pure-Dart packages) may differ: anything else —
          # e.g. MaterialIcons-Regular.otf after using an icon the release
          # lacks — would show blank on phones, so it fails the patch.
          set +e
          shorebird patch android --release-version="$release" 2>&1 | tee patch.log
          status=${PIPESTATUS[0]}
          set -e
          [ "$status" -eq 0 ] && exit 0
          grep -q 'asset changes' patch.log || exit "$status"
          changed=$(grep -E '^\s+base/assets/' patch.log | sed 's/^ *//')
          echo "Changed assets:"; echo "$changed"
          if echo "$changed" | grep -qv 'flutter_assets/NOTICES.Z$'; then
            echo "::error::The patch changes assets the release does not have (see above). Use only icons/assets present in release $release, or build a new APK."
            exit 1
          fi
          shorebird patch android --release-version="$release" --allow-asset-diffs
