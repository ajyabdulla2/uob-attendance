# One-off: registers the app with Shorebird (`shorebird init` needs the
# Android SDK, which the developer's PC does not have) and prints the
# generated shorebird.yaml (its app_id is not a secret) in the job summary,
# to be committed to the repo. Needs the SHOREBIRD_TOKEN secret
# (`shorebird login:ci`). Delete this file once shorebird.yaml is committed.
name: Shorebird init

on:
  push:
    paths:
      - '.github/workflows/shorebird-init.yml'
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Token present?
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Add the SHOREBIRD_TOKEN secret (shorebird login:ci), then re-run."
            exit 1
          fi

      - name: Already initialized?
        run: |
          if [ -f shorebird.yaml ]; then
            echo "::error::shorebird.yaml already exists; nothing to do."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Placeholder Firebase options (init only builds the Gradle project)
        run: ./tool/ensure_firebase_options.sh

      - name: shorebird init (options of this version)
        run: shorebird init --help

      - name: shorebird init
        run: shorebird init --force --display-name "UoB Attendance" --verbose < /dev/null

      - name: Show shorebird.yaml
        if: always()
        run: |
          if [ -f shorebird.yaml ]; then
            {
              echo '### shorebird.yaml'
              echo '```yaml'
              cat shorebird.yaml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat shorebird.yaml
          fi
          git status --short
          git diff -- pubspec.yaml android
